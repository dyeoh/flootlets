name: Release

# On every push to main, release-please keeps a Release PR up to date: the
# next version (from the Conventional Commits since the last release), the
# package.json bump and the CHANGELOG.md entry. Merging that PR tags vX.Y.Z,
# creates a GitHub Release, and the publish job puts it on npm.
#
# Run it by hand (Actions, Release, Run workflow) to publish the version on
# main, e.g. after a failed publish: release-please won't re-create a release.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: bun run check:exports
      # Trusted publishing needs no token: npm verifies this workflow through
      # GitHub's OIDC (the trusted publisher on npmjs.com, with direct publish
      # allowed) and adds provenance.
      - run: npm publish --provenance --access public
